name: DevSecOps CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  secret-scan:
    name: 🔑 Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: 📦 Node.js Dependency Audit (SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit Backend Dependencies
        run: |
          cd backend
          npm audit --audit-level=high || true

      - name: Audit Frontend Dependencies
        run: |
          cd Frontend
          npm audit --audit-level=high || true

  sast-scan:
    name: 🔍 SAST Code Security Scan (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Semgrep Security Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: p/security-audit
        continue-on-error: true

  container-scan:
    name: 🐳 Docker Container Security Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t axon-backend:latest ./backend

      - name: Build Frontend Docker Image
        run: docker build -t axon-frontend:latest ./Frontend

      - name: Trivy Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'axon-backend:latest'
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'

      - name: Trivy Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'axon-frontend:latest'
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'
